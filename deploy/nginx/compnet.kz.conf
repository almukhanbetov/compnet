# Reference copy of /etc/nginx/sites-available/compnet.kz on the VPS
# (89.207.254.215), taken 2026-10-17. Everything below this header is the
# server file byte for byte.
#
# NOT applied automatically: the deploy workflow never touches Nginx. A change
# here is applied by hand by a sudo user — see "Nginx" in DEPLOY.md — and a
# change made on the server (including by Certbot) is copied back here.
#
# Main domain: https://compnet.kz. Redirects in this file:
#   www.compnet.kz/*  -> 301 https://compnet.kz/*
#   /index.html       -> 301 https://compnet.kz/
#   /img/favicon.ico  -> 301 https://compnet.kz/favicon.ico
#   http://           -> 301 https:// (Certbot block at the end)
# Holds no secrets: only paths to the Let's Encrypt files on the server.
#
# Stage 8.6A (pending manual application, see DEPLOY.md "Nginx"): the access
# log no longer records query strings. Landing URLs carry UTM tags and ad
# click ids (gclid), and the manager's request search sends ?q= with a phone
# number or an email; the default "combined" format wrote all of it into
# /var/log/nginx/access.log. The referrer is cut before "?" for the same
# reason. Kept: client IP, time, method, path, status, size, user agent and
# response time. These directives are valid here because site files are
# included in nginx's http context.

map $http_referer $compnet_referer_path {
    default "";
    "~^(?<compnet_ref>[^?#]*)" $compnet_ref;
}

log_format compnet_privacy '$remote_addr - $remote_user [$time_local] '
                           '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                           '"$compnet_referer_path" "$http_user_agent" $request_time';

server {

    server_name compnet.kz www.compnet.kz;
    access_log /var/log/nginx/access.log compnet_privacy;
    if ($host = www.compnet.kz) {
        return 301 https://compnet.kz$request_uri;
    }
    location = /index.html {
        return 301 https://compnet.kz/;
    }
    location = /img/favicon.ico {
        return 301 https://compnet.kz/favicon.ico;
    }
    # Chat WebSockets (visitor and manager), see docs/CHAT_REALTIME.md.
    # Exact-match locations take precedence over "location /api/", which
    # does not pass Upgrade/Connection.
    location = /api/v1/chat/ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The backend pings every 25 s, well within this timeout.
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }

    location = /api/v1/manager/ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/compnet.kz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/compnet.kz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot





}
server {
    access_log /var/log/nginx/access.log compnet_privacy;
    if ($host = www.compnet.kz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = compnet.kz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;

    server_name compnet.kz www.compnet.kz;
    return 404; # managed by Certbot




}
