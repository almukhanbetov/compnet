name: Build and Deploy COMPNET
on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compnet-production
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/compnet-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/compnet-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            # Bare origin, no /api suffix: fetch code already builds full
            # paths like /api/v1/services — adding /api here doubles it
            # (https://compnet.kz/api + /api/v1/services -> 404).
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://compnet.kz' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/compnet-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/compnet-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy migrations to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "backend/migrations/*"
          target: "${{ secrets.VPS_PATH }}/migrations"
          strip_components: 2

      - name: Deploy COMPNET over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 20m

          script: |
            set -Eeuo pipefail

            cd "${{ secrets.VPS_PATH }}"

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
              -u "${{ secrets.DOCKERHUB_USERNAME }}" \
              --password-stdin

            # docker-compose.prod.yml interpolates ${DOCKERHUB_USERNAME} in
            # its image: fields — export it here so pull/up always use the
            # account that was just built and pushed above, even if the
            # VPS .env has not been updated yet.
            export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"

            # -p compnet fixes the compose project name so this stack can
            # never collide with an unrelated project on the same VPS.
            docker compose -p compnet \
              --env-file .env \
              -f docker-compose.prod.yml \
              pull

            docker compose -p compnet \
              --env-file .env \
              -f docker-compose.prod.yml \
              up -d --remove-orphans

            echo "----- Database migrations -----"

            # goose is a CLI tool, not a runtime dependency of the backend
            # binary, so migrations never run automatically inside the app
            # container. ghcr.io/pressly/goose is not a public image (pulls
            # come back "denied"), so build goose from source on the fly
            # instead and run it as a throwaway container on the same
            # network as postgres.
            source .env

            docker run --rm \
              --network compnet-network \
              -e GOOSE_DRIVER=postgres \
              -e GOOSE_DBSTRING="postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@compnet-postgres:5432/${POSTGRES_DB}?sslmode=disable" \
              -v "$(pwd)/migrations:/migrations" \
              golang:1.25-alpine \
              sh -c 'go install github.com/pressly/goose/v3/cmd/goose@latest && goose -dir /migrations up'

            # Dangling-image cleanup only (no -a, no volumes) — never
            # touches other projects' images or any named volume.
            docker image prune -f --filter "until=168h"

            echo "----- Containers -----"

            docker compose -p compnet \
              --env-file .env \
              -f docker-compose.prod.yml \
              ps

            echo "----- Backend health -----"

            sleep 10

            curl --fail --show-error http://127.0.0.1:8080/health

            echo "----- Frontend health -----"

            curl --fail --show-error http://127.0.0.1:3000/